[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [""]
exclude = ["logs*", "storage*", "temp*", "tests*", "backups*"]

[project]
name = "charlotte"
version = "1.0.0"
requires-python = ">=3.11"

# Core
dependencies = [
    "aiofiles"
]

[project.optional-dependencies]
bot = [
    "aiogram[i18n]==3.31.0",
    "fluentogram==1.2.1",
    "python-dotenv==1.2.2",
    "sqlalchemy==2.0.51",
    "asyncpg==0.31.0",
    "greenlet==3.5.3",
    "redis~=8.0.1",
    "alembic==1.18.5",
    "translators~=6.0.1",
    "pydantic-settings",
    "httpx"
]

# Dev
[dependency-groups]
dev = [
    "ruff",
    "mypy",
]

[tool.ruff]
extend-exclude = ["alembic", "tests"]

[tool.ruff.lint]
select = ["F", "B", "ASYNC", "S"]
ignore = [
    "ASYNC109",  # timeout is passed through to httpx/aiogram, not an asyncio.timeout replacement
    "S311",      # random.choice for reactions, not cryptography
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]               # re-exports
"utils/search_utils.py" = ["S101"]     # asserts in the __main__ self-check
