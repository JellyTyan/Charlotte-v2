  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: always
    profiles:
      - production
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: ${TELEGRAM_LOCAL}
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
      - ./storage:/app/storage
    networks:
      - charlotte-net
    logging: *default-logging

  postgres:
    image: postgres:18-alpine
    container_name: charlotte_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - charlotte-net
    logging: *default-logging

  pg_backup:
    image: prodrigestivill/postgres-backup-local
    container_name: charlotte_db_backup
    depends_on:
      - postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_DIR: /backups
      KEEP_BACKUPS: "7"
      BACKUP_SCHEDULE: "0 2 * * *"
      COMPRESS_BACKUP: "true"
    volumes:
      - ./backups:/backups
    networks:
      - charlotte-net
    restart: always
    logging: *default-logging

  migrations:
    build: .
    container_name: charlotte_migrations
    user: "1000:1000"
    env_file: .env
    command: alembic upgrade head
    depends_on:
      - postgres
    networks:
      - charlotte-net
    logging: *default-logging

  loki:
    image: grafana/loki:2.9.0
    container_name: charlotte_loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - charlotte-net

  promtail:
    image: grafana/promtail:2.9.0
    container_name: charlotte_promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - charlotte-net
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.2.0
    container_name: charlotte_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"  # Порт для входа в интерфейс
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - charlotte-net
    depends_on:
      - loki

networks:
  charlotte-net:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
  telegram-bot-api-data:
  loki-data:
  grafana-data:
  warp-data: