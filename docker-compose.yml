x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  charlotte:
    build: .
    container_name: charlotte_bot
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    read_only: false
    networks:
      - charlotte-net
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
      migrations:
        condition: service_completed_successfully
      lossless-core:
        condition: service_started
      media-core:
        condition: service_started
    logging: *default-logging

  redis:
    image: valkey/valkey:8-alpine
    container_name: charlotte_redis
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - charlotte-net
    logging: *default-logging

  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider
    container_name: charlotte_bgutil
    networks:
      - charlotte-net
    restart: always
    logging: *default-logging

  warp:
    image: dublok/cloudflare-warp:latest
    container_name: charlotte_warp
    restart: always
    cap_add:
      - NET_ADMIN
    environment:
      - WARP_INSTANCES=1
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    networks:
      - charlotte-net

  lossless-core:
    image: ghcr.io/jellytyan/lossless-core:latest
    container_name: charlotte_lossless_core
    restart: always
    volumes:
      - ${STORAGE_HOST_PATH:-./storage}:/app/storage
    environment:
      - APPLEMUSIC_DEV_TOKEN=${APPLEMUSIC_DEV_TOKEN}
      - STORAGE_PATH=/app/storage
      - PORT=7856
      - BGUTIL_URL=${BGUTIL_URL}
      - YOUTUBE_PROXY=socks5://warp:1080
      - YOUTUBE_FALLBACK_PROXY=${YOUTUBE_FALLBACK_PROXY:-}
      - REDIS_ADDR=${REDIS_ADDR}
    networks:
      - charlotte-net
    deploy:
      resources:
        limits:
          cpus: '2'
    logging: *default-logging

  media-core:
    image: ghcr.io/jellytyan/media-core:latest
    pull_policy: never
    container_name: charlotte_media_core
    restart: always
    volumes:
      - ${STORAGE_HOST_PATH}:/app/storage
    environment:
      - PORT=${MEDIA_CORE_PORT}
      - TWITTER_AUTH_TOKEN=${AUTH_TOKEN}
      - TWITTER_CSRF_TOKEN=${CSRF_TOKEN}
      - BGUTIL_URL=${BGUTIL_URL}
      - STORAGE_PATH=/app/storage
      - YOUTUBE_PROXY=socks5://warp:1080
      - YOUTUBE_FALLBACK_PROXY=${YOUTUBE_FALLBACK_PROXY:-}
      - REDIS_ADDR=${REDIS_ADDR}
      - PIXIV_REFRESH_TOKEN=${PIXIV_REFRESH_TOKEN}
    networks:
      - charlotte-net
    deploy:
      resources:
        limits:
          cpus: '2'
    logging: *default-logging

